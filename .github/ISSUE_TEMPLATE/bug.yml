name: Bug
description: Something does not work, or works differently than the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste prompts, keys or customer data. Security problems: do not open a public issue, mail info@zerononsense.dev.
  - type: input
    id: version
    attributes:
      label: Version
      description: From the Setup Doctor or the About line.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Your system
      description: Windows, macOS or Linux, and Claude Code or Claude Desktop.
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What you did just before
      description: The exact command, or what you said to Claude.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the output, including any `refused: ...` line.
    validations:
      required: true
